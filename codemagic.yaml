workflows:
  amomy-ios-testflight:
    name: AMOMY iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: AMOMY Codemagic

    environment:
      groups:
        - amomy_secrets

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.aliabdelnaser.amomy

      flutter: stable
      xcode: latest
      cocoapods: default

      vars:
        APP_STORE_APPLE_ID: "6811922711"
        APP_STORE_VERSION: "1.0.0"

    scripts:
      # ============================================================
      # 1. VERIFY ENVIRONMENT
      # ============================================================
      - name: Verify Flutter & Environment
        script: |
          set -e

          echo "========================================"
          echo "Flutter"
          echo "========================================"
          flutter --version

          echo ""
          echo "========================================"
          echo "Xcode"
          echo "========================================"
          xcodebuild -version

          echo ""
          echo "========================================"
          echo "App Store configuration"
          echo "========================================"
          echo "Apple App ID: $APP_STORE_APPLE_ID"
          echo "Marketing Version: $APP_STORE_VERSION"

      # ============================================================
      # 2. VERIFY REQUIRED SECRETS
      # ============================================================
      - name: Verify Required Secrets
        script: |
          set -e

          if [ -z "${GOOGLE_MAPS_IOS_API_KEY:-}" ]; then
            echo "ERROR: GOOGLE_MAPS_IOS_API_KEY is not configured."
            exit 1
          fi

          if [ -z "${GOOGLE_WEB_CLIENT_ID:-}" ]; then
            echo "ERROR: GOOGLE_WEB_CLIENT_ID is not configured."
            echo "Google Native Sign-In with Supabase requires the Web OAuth Client ID."
            exit 1
          fi

          echo "Required iOS secrets are configured."

      # ============================================================
      # 3. SET UP iOS SECRETS
      # ============================================================
      - name: Set up iOS Secrets
        script: |
          set -e

          mkdir -p ios/Flutter

          cat > ios/Flutter/Secrets.xcconfig <<EOF
          GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_IOS_API_KEY
          EOF

          echo "Generated ios/Flutter/Secrets.xcconfig"

          if [ -n "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist injected from Codemagic secret."
          else
            if [ -f "ios/Runner/GoogleService-Info.plist" ]; then
              echo "Using existing ios/Runner/GoogleService-Info.plist"
            else
              echo "ERROR: GoogleService-Info.plist was not found."
              exit 1
            fi
          fi

      # ============================================================
      # 4. INSTALL FLUTTER DEPENDENCIES
      # ============================================================
      - name: Install Flutter Dependencies
        script: |
          set -e
          flutter pub get

      # ============================================================
      # 5. INSTALL COCOAPODS
      # ============================================================
      - name: Install CocoaPods Dependencies
        script: |
          set -e

          cd ios
          pod install
          cd ..

      # ============================================================
      # 6. STATIC ANALYSIS
      # ============================================================
      - name: Flutter Analyze
        script: |
          set -e
          flutter analyze

      # ============================================================
      # 7. TESTS
      # ============================================================
      - name: Flutter Test
        script: |
          set -e
          flutter test

      # ============================================================
      # 8. SET UP CODE SIGNING
      # ============================================================
      - name: Set up Code Signing
        script: |
          set -e
          xcode-project use-profiles

      # ============================================================
      # 9. RESOLVE NEXT TESTFLIGHT BUILD NUMBER
      # ============================================================
      - name: Resolve Next TestFlight Build Number
        script: |
          set -e

          echo "========================================"
          echo "Resolving TestFlight build number"
          echo "========================================"

          echo "App ID: $APP_STORE_APPLE_ID"
          echo "Marketing version: $APP_STORE_VERSION"

          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")

          LATEST_BUILD=$(printf '%s' "$LATEST_BUILD" | tr -d '[:space:]')

          case "$LATEST_BUILD" in
            ''|*[!0-9]*)
              echo "ERROR: Could not determine latest TestFlight build number."
              echo "Returned value was not a valid integer."
              exit 1
              ;;
          esac

          echo "Latest TestFlight build: $LATEST_BUILD"

          IOS_BUILD_NUMBER=$((LATEST_BUILD + 1))

          if [ "$IOS_BUILD_NUMBER" -le "$LATEST_BUILD" ]; then
            echo "ERROR: Invalid build-number calculation."
            exit 1
          fi

          if [ "$IOS_BUILD_NUMBER" -le 1 ]; then
            echo "ERROR: Invalid next build number: $IOS_BUILD_NUMBER"
            echo "Build 1 has already been used."
            exit 1
          fi

          echo "Next TestFlight build: $IOS_BUILD_NUMBER"

          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$CM_ENV"

      # ============================================================
      # 10. BUILD SIGNED IPA
      # ============================================================
      - name: Build iOS IPA
        script: |
          set -e

          if [ -z "${IOS_BUILD_NUMBER:-}" ]; then
            echo "ERROR: IOS_BUILD_NUMBER was not generated."
            exit 1
          fi

          echo "========================================"
          echo "Building AMOMY iOS"
          echo "========================================"
          echo "Marketing version: $APP_STORE_VERSION"
          echo "Build number: $IOS_BUILD_NUMBER"
          echo "Bundle ID: com.aliabdelnaser.amomy"

          flutter build ipa \
            --release \
            --build-name="$APP_STORE_VERSION" \
            --build-number="$IOS_BUILD_NUMBER" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --export-options-plist=/Users/builder/export_options.plist

      # ============================================================
      # 11. VERIFY IPA OUTPUT
      # ============================================================
      - name: Verify IPA Output
        script: |
          set -e

          echo "========================================"
          echo "Verifying IPA"
          echo "========================================"

          IPA_FILE=$(find build/ios/ipa -maxdepth 1 -name "*.ipa" | head -n 1)

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No IPA was generated."
            exit 1
          fi

          echo "IPA generated successfully:"
          echo "$IPA_FILE"

          echo "Marketing version: $APP_STORE_VERSION"
          echo "Build number: $IOS_BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/archive/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false